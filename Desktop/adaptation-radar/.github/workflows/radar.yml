name: Adaptation Radar

on:
  schedule:
    # Mon / Wed / Fri at 14:00 UTC (~7am PT)
    - cron: "0 14 * * 1,3,5"
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python radar.py

      - name: Commit digest + state
        run: |
          git config user.name "adaptation-radar"
          git config user.email "adaptation-radar@localhost"
          git add digests state.json
          git diff --staged --quiet || git commit -m "radar digest $(date +%F)"
          git push
